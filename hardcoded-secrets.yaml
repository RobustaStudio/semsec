# ============================================================================
# Robusta Studio - Hardcoded Secrets & API Keys Detection Rules
# Copyright (c) 2026 Robusta Studio. All rights reserved.
#
# Precision rules for detecting leaked credentials, API keys, tokens,
# private keys, and other secrets hardcoded in source code.
# High-precision patterns targeting specific provider key formats.
#
# Usage: semgrep --config hardcoded-secrets.yaml /path/to/project
# ============================================================================

rules:

  # -- AWS Access Keys -------------------------------------------------------

  - id: robusta-secrets-aws-access-key
    patterns:
      - pattern-regex: (?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}
    paths:
      exclude:
        - "*.md"
        - "*.txt"
        - "*.lock"
    message: >
      AWS Access Key ID detected (starts with AKIA/ABIA/ACCA/ASIA followed by
      16 alphanumeric characters). Rotate immediately via IAM console and use
      environment variables or AWS Secrets Manager instead.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      references:
        - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
      provider: AWS
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-aws-secret-key
    patterns:
      - pattern-regex: (?i)(?:aws_secret_access_key|aws_secret_key|secret_access_key)\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})['"]?
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      AWS Secret Access Key detected (40-character base64 string assigned to a
      known AWS key variable). Rotate via IAM and store in environment variables
      or AWS Secrets Manager.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: AWS
    severity: ERROR
    languages: [generic]

  # -- Google Cloud / GCP ---------------------------------------------------

  - id: robusta-secrets-gcp-api-key
    patterns:
      - pattern-regex: AIza[0-9A-Za-z\-_]{35}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Google Cloud API key detected (AIza prefix + 35 characters). Restrict the
      key's scope in the GCP Console and use Application Default Credentials or
      Secret Manager for server-side code.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: GCP
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-gcp-service-account
    patterns:
      - pattern-regex: \"type\"\s*:\s*\"service_account\"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      GCP service account JSON key file committed to repository. These contain
      a private key that grants full service account permissions. Remove from
      repo, rotate the key in IAM, and use Workload Identity Federation instead.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: GCP
    severity: ERROR
    languages: [generic]

  # -- GitHub Tokens ---------------------------------------------------------

  - id: robusta-secrets-github-pat
    patterns:
      - pattern-regex: gh[pousr]_[A-Za-z0-9_]{36,255}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      GitHub Personal Access Token detected (ghp_/gho_/ghu_/ghs_/ghr_ prefix).
      Revoke at github.com/settings/tokens and use GITHUB_TOKEN in CI or
      environment variables for local dev.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: GitHub
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-github-fine-grained-pat
    patterns:
      - pattern-regex: github_pat_[A-Za-z0-9_]{82,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      GitHub fine-grained Personal Access Token detected. Revoke immediately
      at github.com/settings/tokens and use repository-scoped tokens with
      minimal permissions.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: GitHub
    severity: ERROR
    languages: [generic]

  # -- GitLab Tokens ---------------------------------------------------------

  - id: robusta-secrets-gitlab-token
    patterns:
      - pattern-regex: glpat-[A-Za-z0-9\-_]{20,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      GitLab Personal Access Token detected (glpat- prefix). Revoke in
      GitLab user settings and use CI_JOB_TOKEN or deploy tokens with
      minimal scope instead.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: GitLab
    severity: ERROR
    languages: [generic]

  # -- Slack Tokens ----------------------------------------------------------

  - id: robusta-secrets-slack-token
    patterns:
      - pattern-regex: xox[baprs]-[0-9]{10,13}-[0-9A-Za-z\-]{20,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Slack API token detected (xoxb-/xoxa-/xoxp-/xoxr-/xoxs- prefix).
      Revoke in Slack app settings and store tokens in a secrets manager.
      Bot tokens (xoxb-) can read messages and act as the app.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Slack
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-slack-webhook
    patterns:
      - pattern-regex: https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Slack Incoming Webhook URL detected. Anyone with this URL can post
      messages to the linked channel. Remove from code and configure via
      environment variable.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: MEDIUM
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Slack
    severity: WARNING
    languages: [generic]

  # -- Stripe Keys -----------------------------------------------------------

  - id: robusta-secrets-stripe-secret-key
    patterns:
      - pattern-regex: sk_live_[0-9a-zA-Z]{24,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Stripe live secret key detected (sk_live_ prefix). This key can create
      charges, refunds, and access customer data. Rotate immediately in the
      Stripe Dashboard and use restricted keys with minimal permissions.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Stripe
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-stripe-restricted-key
    patterns:
      - pattern-regex: rk_live_[0-9a-zA-Z]{24,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Stripe live restricted key detected (rk_live_ prefix). Rotate in
      Stripe Dashboard and store in environment variables or a secrets manager.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Stripe
    severity: ERROR
    languages: [generic]

  # -- Twilio ----------------------------------------------------------------

  - id: robusta-secrets-twilio-api-key
    patterns:
      - pattern-regex: SK[0-9a-fA-F]{32}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Twilio API Key detected (SK prefix + 32 hex characters). Revoke in
      Twilio Console and use environment variables. Twilio keys can send
      SMS, make calls, and access account resources.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Twilio
    severity: ERROR
    languages: [generic]

  # -- SendGrid --------------------------------------------------------------

  - id: robusta-secrets-sendgrid-api-key
    patterns:
      - pattern-regex: SG\.[A-Za-z0-9\-_]{22,}\.[A-Za-z0-9\-_]{22,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      SendGrid API key detected (SG.xxx.xxx format). Revoke in SendGrid
      Settings > API Keys and use environment variables. Leaked keys allow
      sending emails as your domain (phishing risk).
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: SendGrid
    severity: ERROR
    languages: [generic]

  # -- Mailgun ---------------------------------------------------------------

  - id: robusta-secrets-mailgun-api-key
    patterns:
      - pattern-regex: key-[0-9a-zA-Z]{32}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Mailgun API key detected (key- prefix + 32 alphanumeric characters).
      Rotate in Mailgun dashboard and store in environment variables.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Mailgun
    severity: WARNING
    languages: [generic]

  # -- Private Keys ----------------------------------------------------------

  - id: robusta-secrets-private-key-rsa
    patterns:
      - pattern-regex: "-----BEGIN RSA PRIVATE KEY-----"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      RSA private key detected in source code. Private keys must never be
      committed. Remove from repo history with git-filter-repo, rotate the
      key pair, and store private keys in a vault or HSM.
    metadata:
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-private-key-ec
    patterns:
      - pattern-regex: "-----BEGIN EC PRIVATE KEY-----"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      EC private key detected in source code. Remove from repo, rotate the key
      pair, and use a secrets manager or HSM for key storage.
    metadata:
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-private-key-openssh
    patterns:
      - pattern-regex: "-----BEGIN OPENSSH PRIVATE KEY-----"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      OpenSSH private key detected in source code. This grants SSH access to
      any server trusting the corresponding public key. Remove, rotate, and
      use ssh-agent or a vault for key management.
    metadata:
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-private-key-pkcs8
    patterns:
      - pattern-regex: "-----BEGIN PRIVATE KEY-----"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      PKCS#8 private key detected in source code. Remove from repo history,
      rotate the key, and store in a vault or HSM.
    metadata:
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  # -- Heroku ----------------------------------------------------------------

  - id: robusta-secrets-heroku-api-key
    patterns:
      - pattern-regex: (?i)(?:heroku_api_key|heroku_api_token|heroku_oauth_token)\s*[:=]\s*['"]?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}['"]?
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Heroku API key detected (UUID format assigned to a Heroku variable).
      Regenerate at dashboard.heroku.com and use Heroku config vars for
      deployment credentials.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Heroku
    severity: ERROR
    languages: [generic]

  # -- npm / PyPI Tokens -----------------------------------------------------

  - id: robusta-secrets-npm-token
    patterns:
      - pattern-regex: npm_[A-Za-z0-9]{36,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      npm access token detected (npm_ prefix). Revoke at npmjs.com/settings
      and use CIDR-scoped automation tokens for CI/CD. A leaked token allows
      publishing malicious packages under your account (supply chain attack).
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: npm
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-pypi-token
    patterns:
      - pattern-regex: pypi-[A-Za-z0-9\-_]{50,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      PyPI API token detected (pypi- prefix). Revoke at pypi.org/manage/account
      and use project-scoped tokens. A leaked token allows uploading malicious
      packages (supply chain attack).
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: PyPI
    severity: ERROR
    languages: [generic]

  # -- Azure -----------------------------------------------------------------

  - id: robusta-secrets-azure-storage-key
    patterns:
      - pattern-regex: (?i)(?:DefaultEndpointsProtocol|AccountKey)\s*=\s*[A-Za-z0-9+/=]{44,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Azure Storage connection string or account key detected. Rotate the key
      in the Azure Portal and use Managed Identity or Azure Key Vault references
      instead of embedding keys in code.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Azure
    severity: ERROR
    languages: [generic]

  # -- OpenAI / AI Provider Keys ---------------------------------------------

  - id: robusta-secrets-openai-api-key
    patterns:
      - pattern-regex: sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      OpenAI API key detected (sk-...T3BlbkFJ... format). Revoke at
      platform.openai.com/api-keys. Leaked keys incur charges on your account
      and may expose fine-tuned model data.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: OpenAI
    severity: ERROR
    languages: [generic]

  - id: robusta-secrets-openai-project-key
    patterns:
      - pattern-regex: sk-proj-[A-Za-z0-9\-_]{80,}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      OpenAI project API key detected (sk-proj- prefix). Revoke at
      platform.openai.com and use environment variables for API access.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: OpenAI
    severity: ERROR
    languages: [generic]

  # -- Shopify ---------------------------------------------------------------

  - id: robusta-secrets-shopify-token
    patterns:
      - pattern-regex: shpat_[A-Fa-f0-9]{32}
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Shopify Admin API access token detected (shpat_ prefix). Revoke in
      Shopify Partners dashboard. Leaked tokens can read/modify store data
      including customer PII and orders.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Shopify
    severity: ERROR
    languages: [generic]

  # -- Database Connection Strings -------------------------------------------

  - id: robusta-secrets-database-url
    patterns:
      - pattern-regex: (?i)(?:mysql|postgres|postgresql|mongodb|mongodb\+srv|redis|amqp|mssql)://[^:\s]+:[^@\s]+@[^\s'"]+
    paths:
      exclude:
        - "*.md"
        - "*.lock"
        - "*.example"
        - "*.sample"
    message: >
      Database connection string with embedded credentials detected. Extract
      the username and password into environment variables or a secrets manager.
      Connection strings with credentials grant direct database access.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  # -- Generic Password Assignment -------------------------------------------

  - id: robusta-secrets-generic-password-assignment
    patterns:
      - pattern-regex: (?i)(?:password|passwd|pwd|secret|token|api_key|apikey|api_secret|access_token|auth_token|credentials|private_key)\s*[:=]\s*['"][^\s'"]{8,}['"]
      - pattern-not-regex: (?i)(?:password|passwd|pwd|secret|token|api_key|apikey|api_secret|access_token|auth_token|credentials|private_key)\s*[:=]\s*['"](?:\$\{|%s|{{|<|os\.environ|process\.env|ENV\[|getenv|placeholder|example|changeme|your[_-]|REPLACE|TODO|FIXME|xxx|test|dummy|fake|mock|sample)
    paths:
      exclude:
        - "*test*"
        - "*spec*"
        - "*mock*"
        - "*fixture*"
        - "*.md"
        - "*.lock"
        - "*.example"
        - "*.sample"
        - "*.template"
    message: >
      Hardcoded credential detected in a password/secret/token variable
      assignment. Use environment variables, a .env file (gitignored), or a
      secrets manager. Never commit real credentials to source control.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: WARNING
    languages: [generic]

  # -- JWT Secrets in Code ---------------------------------------------------

  - id: robusta-secrets-jwt-secret-generic
    patterns:
      - pattern-regex: (?i)(?:jwt_secret|jwt_key|jwt_signing_key|token_secret)\s*[:=]\s*['"][A-Za-z0-9+/=\-_]{16,}['"]
    paths:
      exclude:
        - "*test*"
        - "*spec*"
        - "*.md"
        - "*.lock"
        - "*.example"
    message: >
      Hardcoded JWT signing secret detected. If this is a symmetric HMAC key,
      anyone with it can forge valid tokens. Store in a secrets manager and
      consider asymmetric RS256/ES256 keys stored in a vault.
    metadata:
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  # -- .env Files Committed --------------------------------------------------

  - id: robusta-secrets-dotenv-committed
    patterns:
      - pattern-regex: (?i)^(?:DATABASE_URL|DB_PASSWORD|SECRET_KEY|API_KEY|AWS_SECRET|STRIPE_SECRET|PRIVATE_KEY|AUTH_TOKEN|OAUTH_SECRET)\s*=\s*\S+
    paths:
      include:
        - ".env"
        - ".env.production"
        - ".env.local"
        - ".env.staging"
    message: >
      Secrets detected in a .env file that appears to be tracked by version
      control. Add .env* to .gitignore and use .env.example with placeholder
      values instead. Rotate any secrets that were committed.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: HIGH
      impact: CRITICAL
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
    severity: ERROR
    languages: [generic]

  # -- Firebase / Google Firebase --------------------------------------------

  - id: robusta-secrets-firebase-url
    patterns:
      - pattern-regex: (?i)(?:firebase_api_key|firebase_token)\s*[:=]\s*['"][A-Za-z0-9\-_]{20,}['"]
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Firebase credential detected in source code. While Firebase API keys
      are semi-public, server keys and admin tokens must be kept secret.
      Use Firebase Admin SDK with service account credentials from environment.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Firebase
    severity: WARNING
    languages: [generic]

  # -- Telegram Bot Token ----------------------------------------------------

  - id: robusta-secrets-telegram-bot-token
    patterns:
      - pattern-regex: "[0-9]{8,10}:[A-Za-z0-9_-]{35}"
    paths:
      exclude:
        - "*.md"
        - "*.lock"
    message: >
      Telegram Bot API token detected (numeric bot ID : alphanumeric secret).
      Revoke via BotFather /revoke command and store the token in environment
      variables.
    metadata:
      cwe: ["CWE-798"]
      owasp: ["A07:2021 Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: MEDIUM
      author: Robusta Studio
      license: "Copyright (c) 2026 Robusta Studio. All rights reserved."
      provider: Telegram
    severity: WARNING
    languages: [generic]

  # -- Discord Bot Token -----------------------------------------------------

  - id: robusta-secrets-discord-bot-token
    patterns:
      - pattern-regex: "[MN][A-Za-z0-9]{23,}\\.[A-Za-z0-9_-]{6}\\.[A-Za-z0-9_-]{27,}"
    paths:
      exclude:
